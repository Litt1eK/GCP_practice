<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-8 text-gray-800">User Registration</h1>
        
        <form id="registrationForm" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" name="name" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Register
            </button>
        </form>
        
        <!-- Status message display -->
        <div id="statusMessage" class="mt-4 p-4 rounded-md hidden">
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const statusMessage = document.getElementById('statusMessage');
        
        // Replace this with your actual cloud function URL
        const CLOUD_FUNCTION_URL = 'YOUR_CLOUD_RUN_URL';
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
        
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value
            };
            
            try {
               
                showMessage('Submitting...', 'bg-blue-100 text-blue-700');
                
              
                const response = await fetch(CLOUD_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    
                    showMessage('Registration successful!', 'bg-green-100 text-green-700');
                    form.reset();
                } else {
                   
                    showMessage(`Error: ${data.error}`, 'bg-red-100 text-red-700');
                }
            } catch (error) {
                showMessage('Failed to connect to server', 'bg-red-100 text-red-700');
            }
        });
        
        function showMessage(message, className) {
            statusMessage.textContent = message;
            statusMessage.className = `mt-4 p-4 rounded-md ${className}`;
            statusMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
