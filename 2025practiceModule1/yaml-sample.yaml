apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: name
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/network-interfaces: '[{"network":"VPC-NAME","subnetwork":"SUBNET-NAME"}]'
    spec:
      containers:
        - image: image
          env:
            - name: 'KEY'
              value: 'VALUE'